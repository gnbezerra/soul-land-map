<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soul Land Map</title>
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="topbar">
    <strong id="title">Soul Land Map</strong>
    <select id="map-select" aria-label="Region"></select>
    <select id="lang-select" aria-label="Language"></select>
    <span class="spacer"></span>
    <button id="sidebar-toggle" type="button" aria-controls="sidebar" aria-expanded="true">Hide filters</button>
  </header>
  <div class="layout">
    <aside id="sidebar" aria-label="Filters"></aside>
    <div id="map-wrap">
      <div id="map"></div>
      <div id="pin" class="hud"></div>
      <div id="readout" class="hud"></div>
    </div>
  </div>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>

</html>
